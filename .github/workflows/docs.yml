name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/site/Gemfile
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify publication snapshot
        run: ruby bin/export-docs --verify
      - name: Build documentation
        run: bundle exec jekyll build --source site --destination site/_site --strict_front_matter --trace
      - name: Check pages, links, assets, and search index
        run: bundle exec ruby bin/check-docs site/_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    if: github.repository == 'techwright-lab/admin_suite' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
