title: AdminSuite
description: A resource-driven admin interface for Rails. Configure resources, dashboards, authentication, and operator MCP.
url: https://techwright-lab.github.io
baseurl: /admin_suite
theme: just-the-docs
color_scheme: admin-dark
permalink: pretty
search_enabled: true
heading_anchors: true
enable_copy_code_button: true
search:
  heading_level: 3
  previews: 3
  focus_shortcut_key: k
